               fließend deutsch, fliessend deutsch, sehr gute deutschkenntnisse,
               deutsch und englisch, deutsch & englisch]
  - name: French required
    keywords: [fluent french, fluency in french, french c1, native french, excellent french,
               french is required, french required, français courant, francais courant]
  - name: German a plus
