# Phrases in a job description that say something about work permits.
work_authorization:
  - name: Sponsorship offered
    keywords: [visa sponsorship, sponsorship available, we sponsor, will sponsor, relocation support,
               relocation package, support with work permit, work permit support]
  - name: Requires existing permit / EU-EFTA
    keywords: [valid work permit, existing work permit, right to work, eligible to work,
               eu/efta, eu or efta, eu-efta, swiss or eu, swiss/eu, no sponsorship, not able to sponsor,
               unable to sponsor, cannot sponsor, without sponsorship, work authorization required,
               must be authorized to work, arbeitsbewilligung, aufenthaltsbewilligung]
default_work_authorization: Not stated

languages:
  - name: German required
    keywords: [fluent german, fluency in german, german fluent, german (c1, german c1, german c2,
               business fluent german, native german, excellent german, strong german,
               german is required, german required, german is mandatory, verhandlungssicher,
               fließend deutsch, fliessend deutsch, sehr gute deutschkenntnisse,
               deutsch und englisch, deutsch & englisch]
  - name: French required
    keywords: [fluent french, fluency in french, french c1, native french, excellent french,
               french is required, french required, français courant, francais courant]
  - name: German a plus
    keywords: [german is a plus, german a plus, german is an advantage, german would be an advantage,
               german is advantageous, knowledge of german, basic german, german desirable,
               german preferred, german is beneficial]
default_language: No extra language stated

work_mode:
