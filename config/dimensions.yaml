# Rules used to infer role dimensions from the job title, company name and job description.
# Rules are checked top to bottom; the first match wins. Matching is case-insensitive and
# on whole words/phrases. Anything inferred can be overridden per application in the app.

seniority:
  # Checked against the job title first, then the job description.
  - name: Internship
    keywords: [intern, internship, praktikum, praktikant, stage, working student, werkstudent,
               placement, summer analyst]
  - name: Graduate / trainee
    keywords: [graduate, trainee, traineeship, apprentice, apprenticeship, fellowship, fellow,
               early career, early careers, early talent, future talent, academy, rotational,
               career starter, postgraduate]
  - name: Junior / entry
    keywords: [junior, jr, jr., entry level, entry-level, assistant, associate i, coordinator,
               i]
  - name: Experienced
    keywords: [senior, sr, sr., lead, principal, head, director, manager, ii, iii, staff]
default_seniority: Mid / unspecified
# If the title gives no level, use years of experience asked for in the description.
years_to_seniority:
  - {max_years: 1, name: Junior / entry}
  - {max_years: 4, name: Mid / unspecified}
  - {max_years: 99, name: Experienced}

