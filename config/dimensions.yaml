    keywords: [fully remote, remote-first, 100% remote, remote position, work from anywhere]
  - name: Hybrid
    keywords: [hybrid, home office, work from home, flexible working, remote days]
  - name: On-site
    keywords: [on-site, onsite, on site, in-office, in the office, laboratory-based, lab-based]
default_work_mode: Not stated

# Skills to look for in job descriptions. Items marked case_sensitive match exactly (e.g. "R").
skills:
  Programming: [python, sql, bash, matlab, java, c++, javascript, julia, sas, stata, spss, git, linux,
                {term: R, case_sensitive: true}]
  Data & ML: [machine learning, deep learning, statistics, statistical analysis, nlp, natural language processing,
              computer vision, pytorch, tensorflow, scikit-learn, pandas, data visualisation, data visualization,
              power bi, tableau, excel, llm, large language models, generative ai, time series, bayesian,
              data pipelines, etl, cloud, aws, azure, google cloud, docker, kubernetes, spark]
  Clinical & regulatory: [gcp, ich-gcp, good clinical practice, clinical trials, clinical trial, ctms, edc, etmf, tmf,
                          pharmacovigilance, regulatory affairs, gmp, gxp, protocol, site management,
                          monitoring, real world evidence, epidemiology, biostatistics, cdisc, sdtm, adam,
                          medical writing, iso 13485, mdr]
  Neuroscience & imaging: [neuroscience, neuroimaging, mri, fmri, eeg, meg, pet, image analysis, imaging,
                           electrophysiology, cognitive, psychology, psychiatry, neurology, cohort]
  Lab: [cell culture, pcr, qpcr, flow cytometry, elisa, western blot, microscopy, crispr, sequencing, ngs]
  Business: [stakeholder management, project management, market access, marketing, sales, business development,
             strategy, presentation skills, consulting, product management, agile, scrum, budgeting,
             competitive intelligence, kol, medical affairs]
# Spoken languages are handled by the `languages` rules above, not as skills.
