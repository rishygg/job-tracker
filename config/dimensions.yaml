                  msd, ucb, lundbeck, takeda, novo nordisk, johnson & johnson, janssen,
                  bristol myers, lilly, abbvie, amgen, biogen, gilead, iqvia, medpace, parexel,
                  icon, syneos, labcorp, thermo fisher, medtronic, siemens, philips, abbott,
                  ubs, deloitte, pwc, ey, kpmg, accenture, mckinsey, bcg, bain, google,
                  microsoft, amazon, nestle, nestlé, l'oréal, lonza, hovione, sandoz,
                  galderma, julius baer, swiss re, zurich insurance, capgemini, sonova,
                  straumann, alcon, ipsen, servier, viatris, teva, csl behring]
