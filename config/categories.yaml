               hinwil, cham, gruyere, vaud, ticino, schlieren, aargau, luzern, lucerne,
               fribourg, neuchâtel, neuchatel, dübendorf, rotkreuz]
  - name: United Kingdom
    keywords: [united kingdom, uk, england, scotland, london, maidenhead, chester, cambridge,
               oxford, manchester, edinburgh, leatherhead, stevenage, reading]
  - name: Germany
    keywords: [germany, deutschland, munich, münchen, berlin, hamburg, kassel, ingelheim,
