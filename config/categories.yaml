# Keyword rules used to auto-categorise applications.
# Rules are checked top to bottom; the first match wins.
# Keywords are case-insensitive and match whole words or phrases.
# You can override the category of any single application in the app.

role_areas:
  - name: Open / speculative application
    keywords: [open application, spontaneous application, initiative application, talent pool,
               cold email, unsolicited]
  - name: Clinical operations
    keywords: [clinical trial, cra, assistant cra, clinical research, clinical site, clinical study,
               clinical project, clinical supply, clinical data, site coordinator, study manager,
               study coordinator, clinical operations, data management, expanded access,
               clinical programmer, clinical solutions]
  - name: Data science / AI
    keywords: [data scientist, data science, data analyst, data engineer, machine learning, ml,
               ai, artificial intelligence, analytics, bioinformatics, bioinformatician,
               biostatistician, statistical programmer, quantitative, data visualisation,
               data visualization, neuroai, informaticist, informatics, data officer, data expert,
               data support]
  - name: Graduate / trainee programme
    keywords: [graduate, trainee, traineeship, fellowship, fellow, programme, program, academy,
               apprenticeship, early careers, early talent, future talent, rotational,
               working student, postgraduate]
  - name: Medical / regulatory / safety
    keywords: [medical affairs, medical writer, medical writing, regulatory, pharmacovigilance,
               safety, vigilance, quality assurance, qa, qc, quality, epidemiology, epidemiologist,
               editor, labelling, cmc, submission, clinical affairs, medical coordinator,
               medical education]
  - name: Commercial / marketing
    keywords: [marketing, brand, sales, commercial, product manager, account manager,
               account executive, business development, key account, market access, hcp, crm,
               customer success, communications, sdr, commex]
  - name: Consulting / business analysis
    keywords: [consultant, consulting, business analyst, strategy, analyst, project manager,
               project coordinator, project assistant, portfolio, procurement, supply chain, operations,
               market intelligence, associate]
  - name: Research / academia
    keywords: [research associate, research assistant, researcher, scientist, phd, postdoc,
               scientifique, research]

# Fallback when nothing matches.
default_role_area: Other

# Location keywords -> region. First match wins.
